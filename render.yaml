services:
  - type: web
    name: csi-cofre-semana15
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: csi-cofre-db
          property: connectionString

databases:
  - name: csi-cofre-db
